<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Змейка</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #181c2e;
    --panel-border: #2a3050;
    --snake: #4ade80;
    --snake-head: #86efac;
    --food: #f472b6;
    --text: #e5e9f5;
    --muted: #8b93b0;
    --accent: #22d3ee;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: radial-gradient(1200px 700px at 50% -10%, #1c2140 0%, var(--bg) 55%);
    font-family: "SF Mono", "Menlo", "Consolas", "JetBrains Mono", monospace;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    width: 100%;
    max-width: 520px;
  }

  .title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: linear-gradient(90deg, var(--snake), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .scores {
    display: flex;
    gap: 20px;
    font-size: 14px;
    color: var(--muted);
  }

  .scores b {
    color: var(--text);
    font-size: 18px;
    margin-left: 6px;
  }

  .stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  canvas {
    display: block;
    border-radius: 10px;
    background: #0c0e18;
  }

  .overlay {
    position: absolute;
    inset: 10px;
    border-radius: 10px;
    background: rgba(12, 14, 24, 0.82);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    opacity: 1;
    transition: opacity 0.2s ease;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay h2 {
    font-size: 26px;
    letter-spacing: 0.03em;
  }

  .overlay p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  .overlay .big {
    font-size: 40px;
    color: var(--snake);
    font-weight: 700;
  }

  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: #0c0e18;
    background: linear-gradient(90deg, var(--snake), var(--accent));
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.2s ease;
    box-shadow: 0 8px 22px rgba(74, 222, 128, 0.25);
  }

  button:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(74, 222, 128, 0.35); }
  button:active { transform: translateY(0); }

  .hint {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.02em;
  }

  kbd {
    background: var(--panel-border);
    border-radius: 5px;
    padding: 2px 7px;
    font-size: 11px;
    color: var(--text);
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title">ЗМЕЙКА</div>
      <div class="scores">
        <span>Счёт<b id="score">0</b></span>
        <span>Рекорд<b id="best">0</b></span>
      </div>
    </div>

    <div class="stage">
      <canvas id="game" width="520" height="520"></canvas>

      <div class="overlay" id="overlay">
        <h2 id="ovTitle">ЗМЕЙКА</h2>
        <p id="ovText">Собирай еду, расти и не врезайся в стены и в себя.<br>Скорость растёт с каждым очком.</p>
        <button id="startBtn">Играть</button>
        <div class="hint">
          <kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> или <kbd>WASD</kbd> · пауза <kbd>Space</kbd>
        </div>
      </div>
    </div>

    <div class="hint">Пауза — <kbd>Space</kbd> или <kbd>P</kbd> · заново — <kbd>R</kbd></div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');

  const GRID = 20;
  const CELL = canvas.width / GRID;

  const store = (function () {
    try {
      const t = 'snake-test';
      localStorage.setItem(t, '1');
      localStorage.removeItem(t);
      return {
        get: function (k) { return localStorage.getItem(k); },
        set: function (k, v) { localStorage.setItem(k, v); }
      };
    } catch (e) {
      let mem = {};
      return {
        get: function (k) { return mem[k] || null; },
        set: function (k, v) { mem[k] = v; }
      };
    }
  })();

  let best = Number(store.get('snake-best') || 0);
  bestEl.textContent = best;

  let snake, dir, nextDir, food, score, stepMs, lastStep, running, paused, dead;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    stepMs = 160;
    lastStep = 0;
    running = false;
    paused = false;
    dead = false;
    scoreEl.textContent = 0;
    spawnFood();
    draw();
  }

  function spawnFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) {
        food = f;
        return;
      }
    }
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      stepMs = Math.max(60, 160 - score * 3);
      spawnFood();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    dead = true;
    running = false;
    if (score > best) {
      best = score;
      store.set('snake-best', best);
      bestEl.textContent = best;
    }
    showOverlay('Игра окончена', 'Твой счёт: <span class="big">' + score + '</span>', 'Ещё раз');
  }

  function showOverlay(title, text, btnLabel) {
    ovTitle.innerHTML = title;
    ovText.innerHTML = text;
    startBtn.textContent = btnLabel;
    overlay.classList.remove('hidden');
  }

  function hideOverlay() {
    overlay.classList.add('hidden');
  }

  function start() {
    reset();
    hideOverlay();
    running = true;
    lastStep = performance.now();
    requestAnimationFrame(loop);
  }

  function loop(now) {
    if (!running) return;
    if (paused) {
      lastStep = now;
    } else if (now - lastStep >= stepMs) {
      lastStep = now;
      step();
      if (dead) return;
    }
    draw();
    requestAnimationFrame(loop);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // food
    drawCell(food.x, food.y, 'rgba(244,114,182,0.25)', 0.42);
    ctx.fillStyle = '#f472b6';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.28, 0, Math.PI * 2);
    ctx.fill();

    // snake
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = 1 - i / Math.max(snake.length - 1, 1);
      const isHead = i === 0;
      const color = isHead ? '#86efac' : lerpColor('#22c55e', '#4ade80', t);
      drawCell(s.x, s.y, color, isHead ? 0.34 : 0.28);
    }

    // eyes on head
    const h = snake[0];
    const cx = h.x * CELL + CELL / 2;
    const cy = h.y * CELL + CELL / 2;
    const off = CELL * 0.16;
    let e1, e2;
    if (dir.x !== 0) {
      e1 = [cx + dir.x * off, cy - off];
      e2 = [cx + dir.x * off, cy + off];
    } else {
      e1 = [cx - off, cy + dir.y * off];
      e2 = [cx + off, cy + dir.y * off];
    }
    ctx.fillStyle = '#0c0e18';
    ctx.beginPath();
    ctx.arc(e1[0], e1[1], CELL * 0.08, 0, Math.PI * 2);
    ctx.arc(e2[0], e2[1], CELL * 0.08, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawCell(gx, gy, color, radiusRatio) {
    const x = gx * CELL, y = gy * CELL;
    const r = CELL * radiusRatio;
    ctx.fillStyle = color;
    roundRect(x + 1.5, y + 1.5, CELL - 3, CELL - 3, r);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function lerpColor(a, b, t) {
    const pa = hexToRgb(a), pb = hexToRgb(b);
    const r = Math.round(pa.r + (pb.r - pa.r) * t);
    const g = Math.round(pa.g + (pb.g - pa.g) * t);
    const bl = Math.round(pa.b + (pb.b - pa.b) * t);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  function setDirection(x, y) {
    if (x === -dir.x && y === -dir.y) return; // no reverse
    nextDir = { x, y };
  }

  document.addEventListener('keydown', function (e) {
    const k = e.key;
    const arrows = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
      W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
    };
    if (arrows[k]) {
      e.preventDefault();
      setDirection(arrows[k][0], arrows[k][1]);
      return;
    }
    if (k === ' ' || k === 'p' || k === 'P') {
      e.preventDefault();
      if (running && !dead) {
        paused = !paused;
        if (paused) showOverlay('Пауза', 'Нажми <kbd>Space</kbd>, чтобы продолжить', 'Продолжить');
        else hideOverlay();
      }
    }
    if (k === 'r' || k === 'R') {
      start();
    }
  });

  startBtn.addEventListener('click', function () {
    if (paused) { paused = false; hideOverlay(); }
    else start();
  });

  reset();
})();
</script>
</body>
</html>
