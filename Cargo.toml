[package]
name = "radar"
version = "0.6.12"
edition = "2021"
rust-version = "1.88"
description = "Терминальный мультиплексор для AI-агентов: список агентов, статусы, уведомления"
license = "MIT"
readme = "README.md"
keywords = ["tui", "ai", "agents", "terminal", "claude"]

[dependencies]
libc = "0.2"
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
unicode-width = "0.2"
vt100 = "0.16.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[package.metadata.deb]
maintainer = "off-art <off-art@users.noreply.github.com>"
copyright = "2026, off-art"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "libnotify-bin, pulseaudio-utils, xclip"
extended-description = """\
Radar запускает несколько AI-агентов (Claude Code, Codex, OpenCode, Qwen Code, \
GigaCode, Gemini CLI) в одном окне терминала, показывает статусы, \
git-состояние и присылает уведомления, когда агент закончил или ждёт ответа."""
assets = [
    ["target/release/radar", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/radar/README.md", "644"],
]
